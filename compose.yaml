services:
  postgres:
    image: postgres:18.6
    container_name: postgres
    environment:
      POSTGRES_USER: ${PGUSER:?PGUSER is not set}
      POSTGRES_PASSWORD: ${PGPASSWORD:?PGPASSWORD is not set}
      POSTGRES_DB: ${PGDATABASE:?PGDATABASE is not set}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: