[project]
name = "pipeline_forge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Philippe Hamel" }
]
requires-python = ">=3.14"
dependencies = []

# [project.scripts]
# pipeline-forge = "pipeline_forge:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
addopts = "--cov=pipeline_forge --cov-report=term-missing --cov-branch"